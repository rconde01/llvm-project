[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flang-ast"
version = "0.1.0"
description = "Typed Python loader for flang's JSON parse tree dump"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0 WITH LLVM-exception" }
authors = [{ name = "Flang contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://flang.llvm.org"

[project.scripts]
flang-ast-annotate = "flang_ast.annotate:main"

[tool.setuptools]
packages = ["flang_ast"]

[tool.setuptools.package-data]
flang_ast = ["py.typed"]
